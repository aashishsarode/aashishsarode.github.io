name: Generate GitHub profile SVGs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches:
      - master
      - main
    paths:
      - ".github/scripts/generate-github-svgs.mjs"
      - ".github/workflows/generate-github-svgs.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SVG assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: aashishsarode
        run: node .github/scripts/generate-github-svgs.mjs

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/github-profile.svg assets/generated/github-repositories.svg
          git diff --cached --quiet || git commit -m "Update generated GitHub profile SVGs"
          git push
